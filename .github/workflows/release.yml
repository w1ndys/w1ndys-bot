name: 发布容器镜像

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 验证源码
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 校验版本标签
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.(0[1-9]|1[0-2])\.([012][0-9]|3[01])\.([01][0-9]|2[0-3])[0-5][0-9]$ ]]; then
            echo "版本标签必须符合 vYYYY.MM.DD.HHmm" >&2
            exit 1
          fi
          timestamp="${GITHUB_REF_NAME#v}"
          timestamp="${timestamp:0:4}-${timestamp:5:2}-${timestamp:8:2} ${timestamp:11:2}:${timestamp:13:2}"
          if [[ "$(date -u -d "$timestamp" '+%Y-%m-%d %H:%M' 2>/dev/null)" != "$timestamp" ]]; then
            echo "版本标签包含无效日期或时间" >&2
            exit 1
          fi

      - name: 校验发布提交属于默认分支
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "版本标签必须指向默认分支中的提交" >&2
            exit 1
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 WebUI 依赖
        run: npm --prefix web ci

      - name: 检查 Go 格式
        run: test -z "$(gofmt -l cmd internal pkg plugins)"

      - name: 检查 Go 代码
        run: go vet ./...

      - name: 运行 Go 测试
        run: go test ./...

      - name: 构建 WebUI
        run: npm --prefix web run build

      - name: 安装 E2E 浏览器
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: 运行 WebUI E2E
        run: npm --prefix web run test:e2e

  publish:
    name: 发布多架构镜像
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=w1ndys-bot
            org.opencontainers.image.description=NapCat OneBot 11 群机器人

      - name: 拒绝覆盖已有版本镜像
        run: |
          version_image="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            set +e
            inspect_output="$(docker buildx imagetools inspect "$version_image" 2>&1)"
            inspect_status=$?
            set -e
            if [[ $inspect_status -eq 0 ]]; then
              echo "版本镜像 $version_image 已存在，拒绝覆盖。若 Release 仍为草稿，请人工核对摘要后发布草稿，不要重跑发布任务。" >&2
              exit 1
            fi
            if grep -Eqi '(manifest unknown|not found|404)' <<< "$inspect_output"; then
              exit 0
            fi
            if [[ $attempt -lt 3 ]]; then
              sleep $((attempt * 5))
              continue
            fi
            echo "无法确认版本镜像是否存在，停止发布：$inspect_output" >&2
            exit 1
          done

      - name: 准备 GitHub Release 草稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "版本 $GITHUB_REF_NAME 已发布，拒绝覆盖" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft --title "$GITHUB_REF_NAME"
          fi

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > "$notes_file"
          printf '\n\n容器镜像：%s:%s（linux/amd64、linux/arm64）\n\n镜像摘要：%s\n' \
            "$IMAGE_NAME" "$GITHUB_REF_NAME" "$IMAGE_DIGEST" >> "$notes_file"
          for attempt in 1 2 3 4 5; do
            if gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --notes-file "$notes_file"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "镜像已发布，但 Release 仍为草稿。请人工核对镜像摘要后发布草稿，不要重跑发布任务。" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 更新 latest 镜像标签
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
